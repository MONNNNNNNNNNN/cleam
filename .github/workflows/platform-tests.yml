name: platform-tests

# The unit tests mock the platform away, which is why they pass on Linux while
# a Windows path is broken. These jobs run the real thing: the real registry,
# the real installer, the real /Applications folder.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # Monday, so a platform change surfaces without a push

defaults:
  run:
    shell: bash

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: End-to-end on a real ${{ matrix.os }}
        run: python tests/platform_smoke.py

  windows-installer:
    # Builds the installer and actually installs it, silently, then removes it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pyinstaller
      - run: pyinstaller --onefile --name cleam --paths src --distpath dist packaging/entry.py
      - run: ls -la dist
      - run: choco install innosetup -y --no-progress
      - run: '"/c/Program Files (x86)/Inno Setup 6/ISCC.exe" //DAppVersion=0.0.0-test packaging/cleam.iss'
      - name: Install silently
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist-installer\*.exe)[0].FullName
          Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $installed = "$env:ProgramFiles\Cleam\cleam.exe", "$env:LOCALAPPDATA\Programs\Cleam\cleam.exe"
          # @(): one match comes back as a string, and $found[0] would then be
          # its first character -- "The term 'C' is not recognized".
          $found = @($installed | Where-Object { Test-Path $_ })
          if ($found.Count -eq 0) { throw "installer put nothing in $installed" }
          $exe = $found[0]
          Write-Host "installed at $exe"
          & $exe --version
          & $exe scan
          if ($LASTEXITCODE -ne 0) { throw "installed cleam.exe scan exited $LASTEXITCODE" }
          "CLEAM_DIR=$(Split-Path $exe)" >> $env:GITHUB_ENV
      - name: Upgrade over a v0.1.4 install removes the old window
        shell: pwsh
        run: |
          $gui = Join-Path $env:CLEAM_DIR 'cleam-gui.exe'
          Copy-Item (Join-Path $env:CLEAM_DIR 'cleam.exe') $gui
          $setup = (Get-ChildItem dist-installer\*.exe)[0].FullName
          Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if (Test-Path $gui) { throw "upgrade left cleam-gui.exe behind" }
          if (-not (Test-Path (Join-Path $env:CLEAM_DIR 'cleam.exe'))) { throw "upgrade lost cleam.exe" }
      - name: menu.ps1 clears what run.ps1 downloaded
        shell: pwsh
        run: |
          # A copy checked minutes ago, so menu.ps1 starts it without asking
          # GitHub; the menu itself exits 2 here (no interactive console).
          $dir = Join-Path $env:LOCALAPPDATA 'Cleam\portable'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item dist\cleam.exe (Join-Path $dir 'cleam-v9.9.9.exe')
          Set-Content (Join-Path $dir 'cli-release.txt') 'v9.9.9'
          $old = 'cleam-gui-v0.1.4.exe', 'cleam-gui-v0.1.3.exe.part', 'release.txt'
          foreach ($f in $old) { Set-Content (Join-Path $dir $f) 'old' }
          Get-Content menu.ps1 -Raw | Invoke-Expression
          # The menu's exit 2 would otherwise become the step's exit code.
          if ($LASTEXITCODE -ne 2) { throw "cleam menu exited $LASTEXITCODE, expected 2 (no console)" }
          $global:LASTEXITCODE = 0
          foreach ($f in $old) { if (Test-Path (Join-Path $dir $f)) { throw "menu.ps1 left $f behind" } }
          if (-not (Test-Path (Join-Path $dir 'cleam-v9.9.9.exe'))) { throw "menu.ps1 removed the current copy" }
          Get-ChildItem $dir
      - name: Uninstall silently
        shell: pwsh
        run: |
          $uninstaller = Join-Path $env:CLEAM_DIR 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw "no uninstaller at $uninstaller" }
          Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path (Join-Path $env:CLEAM_DIR 'cleam.exe')) { throw "uninstall left cleam.exe behind" }
          Write-Host "uninstalled cleanly"
