name: release

# Builds what people actually download: a portable CLI binary per OS, the
# window as a single executable, and a Windows installer. Run it by hand
# (Actions -> release -> Run workflow) or by pushing a v* tag, which also
# publishes a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

defaults:
  run:
    shell: bash

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pyinstaller
      - run: pyinstaller --onefile --name cleam --paths src packaging/entry.py
      - run: ./dist/cleam --version && ./dist/cleam scan
      - uses: actions/upload-artifact@v4
        with:
          name: cleam-cli-${{ runner.os }}-${{ runner.arch }}
          path: dist/cleam*

  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # flet-cli is installed explicitly: `flet pack` otherwise fetches it on
      # first use, which is a surprise in a build log.
      - run: pip install -e '.[gui]' flet-cli pyinstaller
      - run: flet pack packaging/entry_gui.py --name cleam-gui --product-name Cleam --yes
      - run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: cleam-gui-${{ runner.os }}-${{ runner.arch }}
          path: dist/cleam-gui*

  installer:
    needs: [cli, gui]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cleam-cli-Windows-X64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: cleam-gui-Windows-X64
          path: dist
      - run: ls -la dist
      - name: Read the version
        id: version
        run: echo "value=$(python -c "import re;print(re.search(r'\"(.+?)\"', open('src/cleam/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"
      - run: choco install innosetup -y --no-progress
      - name: Build the installer
        run: '"/c/Program Files (x86)/Inno Setup 6/ISCC.exe" //DAppVersion=${{ steps.version.outputs.value }} packaging/cleam.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: cleam-installer
          path: dist-installer/*.exe

  publish:
    needs: [cli, gui, installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
      - run: ls -R downloads
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes $(find downloads -type f)
