name: release

# Builds what people actually download: a portable CLI binary per OS (the
# Windows one is what menu.ps1 fetches) and a Windows installer. Run it by hand
# (Actions -> release -> Run workflow) or by pushing a v* tag, which also
# publishes a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

defaults:
  run:
    shell: bash

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pyinstaller
      - run: pyinstaller --onefile --name cleam --paths src packaging/entry.py
      - run: ./dist/cleam --version && ./dist/cleam scan
      - uses: actions/upload-artifact@v4
        with:
          name: cleam-cli-${{ runner.os }}-${{ runner.arch }}
          path: dist/cleam*
          if-no-files-found: error

  installer:
    needs: [cli]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cleam-cli-Windows-X64
          path: dist
      - run: ls -la dist
      - name: Read the version
        id: version
        run: echo "value=$(python -c "import re;print(re.search(r'\"(.+?)\"', open('src/cleam/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"
      - run: choco install innosetup -y --no-progress
      - name: Build the installer
        run: '"/c/Program Files (x86)/Inno Setup 6/ISCC.exe" //DAppVersion=${{ steps.version.outputs.value }} packaging/cleam.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: cleam-installer
          path: dist-installer/*.exe
          if-no-files-found: error

  publish:
    needs: [cli, installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
      - run: ls -R downloads
      # Each artifact holds a file named plainly (cleam, cleam.exe), and
      # Linux and macOS both produce a `cleam`: a release rejects the second.
      # The artifact name already says OS and arch, so it becomes the file
      # name: cleam-cli-windows-x64.exe is what menu.ps1 downloads.
      - name: Name every file after its OS and architecture
        run: |
          mkdir release
          for dir in downloads/*/; do
            name=$(basename "$dir" | tr '[:upper:]' '[:lower:]')
            for f in "$dir"*; do
              base=$(basename "$f")
              if [ "$name" = cleam-installer ]; then target="$base"
              else target="$name${base#cleam}"; fi
              if [ -e "release/$target" ]; then echo "two files would both be release/$target"; exit 1; fi
              cp "$f" "release/$target"
            done
          done
          ls -la release
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes release/*
