name: release

# Builds what people actually download: a portable CLI binary per OS, the
# window as a single executable, and a Windows installer. Run it by hand
# (Actions -> release -> Run workflow) or by pushing a v* tag, which also
# publishes a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

defaults:
  run:
    shell: bash

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pyinstaller
      - run: pyinstaller --onefile --name cleam --paths src packaging/entry.py
      - run: ./dist/cleam --version && ./dist/cleam scan
      - uses: actions/upload-artifact@v4
        with:
          name: cleam-cli-${{ runner.os }}-${{ runner.arch }}
          path: dist/cleam*
          if-no-files-found: error

  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # flet-cli is installed explicitly: `flet pack` otherwise fetches it on
      # first use, which is a surprise in a build log.
      - run: pip install -e '.[gui]' flet-cli pyinstaller
      - run: flet pack packaging/entry_gui.py --name cleam-gui --product-name Cleam --yes
      # An artifact is a zip without Unix permissions, so a .app bundle has to
      # travel zipped by ditto or its executable arrives non-executable.
      - name: Zip the macOS app bundle
        if: runner.os == 'macOS'
        # Whatever the bundle is called (--product-name could rename it); fails
        # loudly if flet pack produced no bundle at all.
        run: |
          cd dist
          shopt -s nullglob
          apps=(*.app)
          [ ${#apps[@]} -gt 0 ] || { echo "no .app bundle in dist"; exit 1; }
          for app in "${apps[@]}"; do ditto -c -k --keepParent "$app" "cleam-gui.zip" && rm -rf "$app"; done
      - run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: cleam-gui-${{ runner.os }}-${{ runner.arch }}
          path: dist/cleam-gui*
          if-no-files-found: error

  installer:
    needs: [cli, gui]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cleam-cli-Windows-X64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: cleam-gui-Windows-X64
          path: dist
      - run: ls -la dist
      - name: Read the version
        id: version
        run: echo "value=$(python -c "import re;print(re.search(r'\"(.+?)\"', open('src/cleam/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"
      - run: choco install innosetup -y --no-progress
      - name: Build the installer
        run: '"/c/Program Files (x86)/Inno Setup 6/ISCC.exe" //DAppVersion=${{ steps.version.outputs.value }} packaging/cleam.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: cleam-installer
          path: dist-installer/*.exe
          if-no-files-found: error

  publish:
    needs: [cli, gui, installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
      - run: ls -R downloads
      # Each artifact holds files named plainly (cleam, cleam-gui.exe), and
      # Linux and macOS both produce a `cleam`: a release rejects the second.
      # The artifact name already says OS and arch, so it becomes the file
      # name: cleam-gui-windows-x64.exe is what run.ps1 downloads.
      - name: Name every file after its OS and architecture
        run: |
          mkdir release
          for dir in downloads/*/; do
            name=$(basename "$dir" | tr '[:upper:]' '[:lower:]')
            for f in "$dir"*; do
              base=$(basename "$f")
              if [ "$name" = cleam-installer ]; then cp "$f" "release/$base"; continue; fi
              ext=""
              case "$base" in *.exe) ext=.exe ;; *.zip) ext=.zip ;; esac
              cp "$f" "release/$name$ext"
            done
          done
          ls -la release
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes release/*
