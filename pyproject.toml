[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleam"
dynamic = ["version"]
description = "Clean junk files, uninstall programs, take restore points and snapshots."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # stdlib only: keeps the portable binary small and the supply chain empty

[project.optional-dependencies]
# The GUI only. The CLI and the cleaning core stay dependency-free, so the
# portable CLI binary is small and `pip install cleam` pulls nothing.
gui = ["flet>=1.0,<2"]

[project.scripts]
cleam = "cleam.cli:main"
cleam-gui = "cleam.gui:run"

[tool.setuptools.dynamic]
version = { attr = "cleam.__version__" }

[tool.flet]
# Used by `flet build apk` / `flet build ipa`. The mobile builds are an
# experiment: an app on Android or iOS cannot clean another app's files, so
# see docs/platforms.md before promising anything there.
org = "dev.cleam"
product = "Cleam"
company = "Cleam"
copyright = "Cleam"

[tool.flet.app]
path = "src"
module = "cleam_mobile"
